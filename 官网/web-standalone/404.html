<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 | 幻电投企划</title>
<meta name="description" content="您访问的页面不存在。返回幻电投企划首页，或前往公告中心查看最新动态。">
<!-- 404 页不该被收录：搜索引擎已经有了正确地址，收录错误页只会稀释权重 -->
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0D5A38">
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="apple-touch-icon" href="assets/images/favicon.png">

<!--
  ============================================================
  幻电投企划 · 404 页面
  ------------------------------------------------------------
  ★ 这个文件是整站唯一使用「站点根绝对路径」（以 / 开头）的页面，
    这是**故意的**，不要改成相对路径。

    原因：静态托管在收到不存在的地址时，会把 404.html 当作**那个地址本身**
    的内容返回。于是 /foo/bar 这个地址拿到的 404.html 在浏览器眼里位于
    /foo/ 目录下 —— 这时 href="index.html" 会被解析成 /foo/index.html，
    仍然打不开。只有以 / 开头的路径才能稳定指回站点根。

    副作用：如果本站被放在**子目录**里托管（例如 GitHub Pages 的项目页
    /repo/），这些 / 开头的路径会指到域名根而不是子目录，需要相应调整。
    放在域名根（或独立子域）则完全正常。

  ★ 这个页面**不读 data/content.json**，站名与口号是写死的。
    因为 404 可能在任意路径下被触发，相对路径取不到数据文件；
    而且 404 页在内容变更时也不需要跟着变。
  ============================================================
-->

<style>
:root{
  --brand-deep:#1D3C2C;
  --brand-green:#0D5A38;
  --brand-red:#A60402;
  --brand-orange:#EB6108;
  --text:#404040;
  --text-2:#6B7570;
  --surface:#FFFFFF;
  --tint:#F2F6F3;
  --border:rgba(13,90,56,.14);
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.7;
  color:var(--text);
  background:var(--tint);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}

/* ---------- 页头 ---------- */
.hd{background:var(--surface);border-bottom:1px solid var(--border)}
.hd .in{
  max-width:1020px;margin:0 auto;padding:0 20px;height:64px;
  display:flex;align-items:center;gap:10px;
}
.hd img{width:34px;height:34px;object-fit:contain}
.hd .nm{font-size:15px;font-weight:600;color:var(--brand-deep);letter-spacing:.02em}
.hd .en{margin-left:auto;font-size:12px;color:var(--text-2);letter-spacing:.04em}

/* ---------- 主体 ---------- */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 20px}
.box{
  width:100%;max-width:560px;text-align:center;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:48px 32px 40px;
}
.code{
  font-size:72px;line-height:1;font-weight:700;letter-spacing:.04em;
  color:var(--brand-green);margin:0 0 6px;
  font-variant-numeric:tabular-nums;
}
.code b{color:var(--brand-red)}
h1{font-size:20px;font-weight:600;color:var(--brand-deep);margin:0 0 12px}
.lead{margin:0 0 8px;color:var(--text)}
.hint{
  margin:0 0 28px;font-size:13px;color:var(--text-2);
  padding:10px 14px;background:var(--tint);border-radius:var(--r-sm);
  border-left:3px solid var(--brand-orange);text-align:left;
}
.hint code{
  font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12px;
  background:rgba(13,90,56,.08);padding:1px 5px;border-radius:4px;word-break:break-all;
}

/* ---------- 出口 ---------- */
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 20px;border-radius:var(--r-sm);font-size:14px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--brand-deep);transition:.18s;cursor:pointer;
}
.btn:hover{border-color:var(--brand-green);box-shadow:0 2px 10px rgba(13,90,56,.12)}
.btn.pri{background:var(--brand-green);border-color:var(--brand-green);color:#fff}
.btn.pri:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn .go{font-size:15px;line-height:1}

/* ---------- 页脚 ---------- */
footer{
  padding:22px 20px 30px;text-align:center;
  font-size:12px;color:var(--text-2);line-height:1.8;
}
footer .sep{opacity:.45;margin:0 6px}

@media (max-width:560px){
  .hd .en{display:none}
  main{padding:32px 16px}
  .box{padding:36px 20px 30px}
  .code{font-size:60px}
  .acts .btn{flex:1 1 100%;justify-content:center}
}
</style>
</head>
<body>

<header class="hd">
  <div class="in">
    <a href="index.html">
      <img src="assets/images/logo-mark.webp" alt="" width="34" height="34">
    </a>
    <a class="nm" href="index.html">幻电投企划</a>
    <span class="en">From Dreams, to the Future.</span>
  </div>
</header>

<main>
  <div class="box">
    <p class="code">4<b>0</b>4</p>
    <h1>这个页面不存在</h1>
    <p class="lead">地址可能拼错了，或者这个页面已经被移动、还没有建成。</p>
    <p class="hint" id="hint">你访问的是：<code id="path">—</code></p>

    <div class="acts">
      <a class="btn pri" href="index.html">返回首页 <span class="go">→</span></a>
      <a class="btn" href="notice.html">公告中心</a>
      <a class="btn" href="index.html#goods">周边产品</a>
    </div>
  </div>
</main>

<footer>
  <p>本站为东方 Project 非官方同人社团站点，与上海爱丽丝幻乐团无隶属关系；文中机构、企业与商品均属架空设定。</p>
  <p>© 幻电投企划<span class="sep">·</span>Gensokyo Power Investment Corporation</p>
</footer>

<script>
/* 把用户实际访问的地址显示出来，方便他自己发现是不是打错了字。
   纯展示，出错也不影响页面其余部分。 */
(function () {
  var el = document.getElementById('path');
  if (!el) { return; }
  var p = location.pathname + location.search;
  el.textContent = p.length > 120 ? p.slice(0, 120) + '…' : p;
  if (p.length > 120) { el.title = p; }
})();
</script>

</body>
</html>
